# ==========================================================
# FarmConnect AI - Spring Boot Application Configuration
# ==========================================================

spring.application.name=farmconnect-backend
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:farmconnect_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
jwt.secret=${JWT_SECRET:FarmConnectSecretKeyForIndianAgriLaborPlatform2026SecureKey!}
jwt.expirationMs=604800000

# OTP & SMS Gateway Configuration
app.otp.dev-mode=${OTP_DEV_MODE:false}
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.cooldown-seconds=45

# SMS Provider Integration (Fast2SMS / Twilio / Generic)
app.sms.provider=${SMS_PROVIDER:FAST2SMS}
app.sms.api-key=${SMS_PROVIDER_API_KEY:}
app.sms.sender-id=${SMS_PROVIDER_SENDER_ID:FARMCT}
app.sms.template-id=${SMS_PROVIDER_TEMPLATE_ID:}
app.sms.enabled=${SMS_ENABLED:true}

# Python ML Microservice URL
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Gemini API Key (Backend Proxy only)
gemini.api.key=${GEMINI_API_KEY:}
